<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor Local - Tela</title>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8efdc;--cream:#4a200e;--orange:#d97f1e;--red:#c8442a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#1f2427;font-family:'Montserrat',Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.screen{width:100%;max-width:390px;aspect-ratio:9/19;background:var(--bg);border-radius:18px;border:2px solid #2a9d8f;display:flex;flex-direction:column;align-items:center;padding-top:5%;box-sizing:border-box;overflow:hidden}
.logo{width:82%}
.name{font-family:'Kaushan Script','Brush Script MT',cursive;fill:var(--cream)}
.tag{font-family:'Montserrat',Arial,sans-serif;fill:var(--cream);letter-spacing:5px}
</style>
</head>
<body>
<div class="screen">
<svg class="logo" viewBox="0 0 400 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sabor Local - Restaurante Mineiro">
  <circle cx="262" cy="62" r="28" fill="#d97f1e"/>
  <path d="M18 138 Q80 122 118 90 Q135 80 152 88" fill="none" stroke="#4a200e" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 88 Q235 78 262 100 Q290 122 340 138" fill="none" stroke="#4a200e" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 74 Q158 62 170 50 Q182 38 172 26" fill="none" stroke="#4a200e" stroke-width="4" stroke-linecap="round"/>
  <path d="M184 76 Q174 64 184 54" fill="none" stroke="#4a200e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="171" cy="112" r="5" fill="#4a200e"/>
  <path d="M145 124 Q171 114 197 124 L197 130 L145 130 Z" fill="#4a200e"/>
  <path d="M132 132 H210 Q214 168 172 176 Q130 168 132 132 Z" fill="#4a200e"/>
  <path d="M132 136 Q120 136 124 146 Q128 152 138 150 M210 136 Q222 136 218 146 Q214 152 204 150" fill="none" stroke="#4a200e" stroke-width="4" stroke-linecap="round"/>
  <text class="name" x="200" y="240" font-size="76" text-anchor="middle">Sabor Local</text>
  <line x1="88" y1="266" x2="176" y2="266" stroke="#d97f1e" stroke-width="3" stroke-linecap="round"/>
  <line x1="224" y1="266" x2="312" y2="266" stroke="#d97f1e" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 254 L212 274 L188 274 Z" fill="#c8442a"/>
  <text class="tag" x="200" y="302" font-size="13" text-anchor="middle">RESTAURANTE MINEIRO</text>
</svg>
</div>
</body>
</html>
